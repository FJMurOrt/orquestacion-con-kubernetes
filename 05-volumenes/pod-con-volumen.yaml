apiVersion: v1
kind: Pod
metadata:
  name: pod-con-almacenamiento
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      volumeMounts:
        - name: datos
          mountPath: /usr/share/nginx/html
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: almacenamiento-datos